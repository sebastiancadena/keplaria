[project]
name = "keplaria"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.0,<2",
    "aiohttp>=3.13.4",
    "gcsfs>=2024.11.0",
    "google-adk[gcp,otel-gcp]>=2.5.0,<3.0.0",
    "google-cloud-firestore>=2.19,<3",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "opentelemetry-resourcedetector-gcp<=1.12.0a0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# Live tests (real Gemini calls, real Frappe Cloud writes) are opt-in:
# `uv run --env-file .env pytest -m live`. A plain `pytest` run stays hermetic
# apart from the keplaria-test Firestore database (see tests/conftest.py).
addopts = "-m 'not live'"
markers = [
    "live: hits live external systems (Gemini, Frappe Cloud); deselected by default, opt in with -m live",
]
