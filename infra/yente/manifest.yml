# yente manifest — FIXTURE ONLY.
#
# `catalogs` is deliberately empty: no OpenSanctions catalog is fetched from
# data.opensanctions.org or delivery.opensanctions.com. Combined with
# YENTE_AUTO_REINDEX=false, this instance makes zero outbound data-fetch calls.
#
# This is NOT a data-rights limitation — bulk-data rights for this entry are
# confirmed in writing by OpenSanctions. The fixture is indexed because it is
# small, reproducible, and shaped to exercise the screening path
# deterministically. See fixtures/watchlist/README.md.
#
# Adding a catalog entry is a deliberate change with consequences: it makes the
# instance fetch on startup, it lengthens indexing, and it obliges attribution
# in the README. The downloaded data must never be committed to this repo.
catalogs: []

datasets:
  - name: keplaria_synthetic
    title: Keplaria synthetic screening watchlist
    path: /data/entities.ftm.json
    # Monotonic. Bump on every fixture edit or yente will not re-import.
    version: "20260813001"
